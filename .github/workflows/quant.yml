name: Quant desk

# All times UTC. New York is UTC-4 in summer, UTC-5 in winter.
#   every 30 min, 13:05-19:35 weekdays   stocks + crypto + forex (stocks only once the market is open)
#   every 2 hours outside that            crypto + forex
on:
  schedule:
    - cron: "5,35 13-19 * * 1-5"
    - cron: "50 0,2,4,6,8,10,12,20,22 * * *"
  workflow_dispatch:
    inputs:
      markets:
        description: "Which markets"
        default: all
        type: choice
        options: [all, crypto_fx]

permissions:
  contents: write

concurrency:
  group: quant
  cancel-in-progress: false

jobs:
  quant:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-small-v1
      - run: pip install -r requirements.txt -r requirements-research.txt -r requirements-kronos.txt
      - name: Pick markets
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            "5,35 13-19 * * 1-5") m=all ;;
            "") m="${{ inputs.markets }}" ;;
            *) m=crypto_fx ;;
          esac
          echo "markets=${m:-all}" >> "$GITHUB_OUTPUT"
      - name: Quant desk
        run: python -m desk.main quant ${{ steps.m.outputs.markets }}
        env:
          PYTHONUNBUFFERED: "1"
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save the quant plan
        if: always()
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "trading-desk-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "Quant desk $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 5; done
