<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erwann's Trading Desk</title>
<meta name="description" content="Live view of an autonomous AI paper-trading desk: account value, positions, trades and the research behind them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --paper: #EEF2F5;
  --sheet: #F8FAFB;
  --ink: #16233F;
  --ink-2: #4A5772;
  --ink-3: #7D889E;
  --rule: #D5DCE4;
  --gain: #0E7A5C;
  --loss: #B3263E;
  --signal: #E8B425;
  --spy: #9AA6B8;
  --font-data: "Archivo", system-ui, sans-serif;
  --font-note: "Source Serif 4", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101A2E; --sheet: #16223A; --ink: #E7ECF3; --ink-2: #B4BFD0; --ink-3: #7F8BA1;
    --rule: #26334D; --gain: #3CC498; --loss: #F0657C; --spy: #5D6B84;
  }
}
:root[data-theme="dark"] {
  --paper: #101A2E; --sheet: #16223A; --ink: #E7ECF3; --ink-2: #B4BFD0; --ink-3: #7F8BA1;
  --rule: #26334D; --gain: #3CC498; --loss: #F0657C; --spy: #5D6B84;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-data); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums; font-variation-settings: "wdth" 100;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 8px; }
.desk { font-weight: 700; font-variation-settings: "wdth" 112; letter-spacing: -0.01em; font-size: 16px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
@media (max-width: 560px) {
  .desk { font-size: 14px; }
  .theme { display: none; }
  .hide-sm { display: none; }
  td, th { padding-right: 8px; }
}
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); }
.status.live .dot { background: var(--gain); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gain) 18%, transparent); }
.status.dry_run .dot, .status.paused .dot { background: var(--signal); }
.theme { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 13px; color: var(--ink-2); }

/* hero: the one loud thing */
.hero { padding: 20px 0 0; }
.equity { font-size: clamp(52px, 13vw, 128px); line-height: 0.92; font-weight: 800; letter-spacing: -0.035em;
  font-variation-settings: "wdth" 125; margin: 0; }
.equity .cents { font-size: 0.42em; font-weight: 600; letter-spacing: -0.01em; color: var(--ink-2); }
.hero-sub { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; font-size: 15px; color: var(--ink-2); }
.hero-sub b { font-weight: 700; color: var(--ink); }
.tape { position: relative; height: 210px; margin: 18px 0 4px; }
.legend { display: flex; gap: 18px; font-size: 12.5px; color: var(--ink-3); }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.up { color: var(--gain); } .down { color: var(--loss); }

/* tabs */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule);
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 18px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 12px 12px 11px; cursor: pointer; white-space: nowrap; color: var(--ink-3);
  font-weight: 600; border-bottom: 2.5px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.panel { padding: 22px 0 60px; }
.panel[hidden] { display: none; }

h2 { font-size: 21px; font-weight: 700; font-variation-settings: "wdth" 108; letter-spacing: -0.015em; margin: 0 0 4px; }
h3 { font-size: 15px; font-weight: 700; margin: 26px 0 8px; }
.lede { color: var(--ink-2); margin: 0 0 16px; max-width: 70ch; }
.note { font-family: var(--font-note); font-size: 16px; line-height: 1.6; max-width: 68ch; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }

/* key figures row: deliberately plain, not cards */
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--rule); }
.fig { padding: 12px 14px 12px 0; border-bottom: 1px solid var(--rule); }
.fig .v { font-size: 22px; font-weight: 700; font-variation-settings: "wdth" 110; }
.fig .k { font-size: 12.5px; color: var(--ink-3); }

/* tables */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 12.5px; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 11px 10px 11px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.num, th.num { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.sym { font-weight: 700; font-variation-settings: "wdth" 110; }
.side { font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }
.side.long { color: var(--gain); } .side.short { color: var(--loss); }
.tag { font-size: 12.5px; color: var(--ink-2); }

/* progress from stop to target */
.track { position: relative; height: 6px; background: var(--rule); border-radius: 3px; min-width: 110px; margin-top: 7px; }
.track span { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.track .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1.5px; background: var(--ink-3); }

/* plan ideas: a list, not cards */
.idea { padding: 16px 0; border-bottom: 1px solid var(--rule); }
.idea-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.idea-levels { margin-top: 6px; font-size: 14px; color: var(--ink-2); }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 600; font-size: 14px; }
.pill { font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink-2); }

.empty { padding: 28px 0; color: var(--ink-2); max-width: 60ch; }
.two { display: grid; gap: 28px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .two { grid-template-columns: 1fr 1fr; } }
.box-chart { position: relative; height: 230px; }

/* memo drawer */
dialog { border: 0; padding: 0; width: min(760px, 100vw); max-height: 100vh; height: 100vh; margin: 0 0 0 auto;
  background: var(--sheet); color: var(--ink); box-shadow: -12px 0 40px rgba(16,26,46,.25); }
dialog::backdrop { background: rgba(16,26,46,.45); }
.memo { padding: 22px 22px 60px; }
.memo-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; position: sticky; top: 0; background: var(--sheet); padding: 6px 0 12px; border-bottom: 1px solid var(--rule); }
.close { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.memo h3 { margin-top: 24px; }
.memo ul { margin: 6px 0 0; padding-left: 20px; }
.memo li { margin: 4px 0; }
.score { font-weight: 700; }
.check-ok { color: var(--gain); font-weight: 600; } .check-bad { color: var(--loss); font-weight: 600; }

/* trading floor */
.floor-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 18px; margin-bottom: 6px; }
.livedot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); margin-right: 6px; vertical-align: middle; }
.livedot.on { background: var(--gain); }
.desk-block { margin-top: 26px; }
.desk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.desk-head h3 { margin: 0; font-size: 17px; font-variation-settings: "wdth" 110; }
.seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0 22px; }
.seat { display: grid; grid-template-columns: 40px 1fr; gap: 10px; padding: 13px 4px 13px 0; border-bottom: 1px solid var(--rule);
  background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; cursor: pointer; width: 100%; }
.seat:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px;
  font-variation-settings: "wdth" 115; position: relative; }
.avatar.research { background: var(--ink); color: var(--paper); }
.avatar.trading { background: var(--gain); color: var(--paper); }
.avatar.learning { background: var(--signal); color: #16233F; }
.avatar .st { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--paper); background: var(--ink-3); }
.seat.working .avatar .st { background: var(--signal); }
@media (prefers-reduced-motion: no-preference) { .seat.working .avatar .st { animation: pulse 1.4s ease-in-out infinite; } }
@keyframes pulse { 50% { transform: scale(1.35); } }
.seat-name { font-weight: 700; font-size: 14.5px; }
.seat-role { font-size: 12.5px; color: var(--ink-3); display: block; }
.seat-now { font-size: 13.5px; margin-top: 5px; line-height: 1.4; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.seat.working .seat-now { color: var(--ink); }
.seat-now b { font-weight: 700; }
.feed { margin-top: 30px; }
.feed-row { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.feed-row .when { color: var(--ink-3); font-size: 12.5px; padding-top: 1px; }
.feed-row .who { font-weight: 700; }
.kind-blocked .what, .kind-error .what { color: var(--loss); }
.kind-trade .what, .kind-decision .what { color: var(--ink); }
footer { color: var(--ink-3); font-size: 12.5px; padding: 0 0 40px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="desk">Erwann's Trading Desk</div>
    <div style="display:flex;gap:12px;align-items:center">
      <span class="status" id="status"><span class="dot"></span><span id="status-text">Loading</span></span>
      <button class="theme" id="theme" aria-label="Switch light or dark theme">Theme</button>
    </div>
  </header>

  <section class="hero" aria-label="Account value">
    <p class="equity" id="equity">$—</p>
    <div class="hero-sub" id="hero-sub"></div>
    <div class="tape"><canvas id="curve" aria-label="Account value compared with the S&P 500"></canvas></div>
    <div class="legend"><span><i style="background:var(--ink)"></i>The desk</span><span><i style="background:var(--spy)"></i>S&amp;P 500, same $10,000</span></div>
  </section>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button class="tab" role="tab" data-tab="floor">Trading floor</button>
    <button class="tab" role="tab" data-tab="positions">Positions</button>
    <button class="tab" role="tab" data-tab="trades">Trade log</button>
    <button class="tab" role="tab" data-tab="plan">Today's game plan</button>
    <button class="tab" role="tab" data-tab="stats">Performance</button>
    <button class="tab" role="tab" data-tab="ghost">Passed ideas</button>
    <button class="tab" role="tab" data-tab="learning">Lessons</button>
  </nav>

  <main>
    <section class="panel" id="p-overview"></section>
    <section class="panel" id="p-floor" hidden></section>
    <section class="panel" id="p-positions" hidden></section>
    <section class="panel" id="p-trades" hidden></section>
    <section class="panel" id="p-plan" hidden></section>
    <section class="panel" id="p-stats" hidden></section>
    <section class="panel" id="p-ghost" hidden></section>
    <section class="panel" id="p-learning" hidden></section>
  </main>
  <footer id="foot"></footer>
</div>

<dialog id="memo" aria-label="Research memo"><div class="memo" id="memo-body"></div></dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (x, d = 2) => x == null ? "—" : (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const signed = (x, d = 2) => x == null ? "—" : (x > 0 ? "+" : x < 0 ? "-" : "") + money(Math.abs(x), d).replace("-", "");
const pct = (x, d = 2) => x == null ? "—" : (x > 0 ? "+" : "") + x.toFixed(d) + "%";
const cls = (x) => x > 0 ? "up" : x < 0 ? "down" : "";
const px = (x) => x == null ? "—" : (Math.abs(x) >= 10 ? x.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}) : Math.abs(x) >= 0.01 ? (+x).toFixed(4) : (+x).toPrecision(4));
const when = (iso) => iso ? new Date(iso).toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}) : "—";
const assetName = {stock: "Stock", etf: "ETF", crypto: "Crypto", forex: "Forex", option: "Options"};
const statusName = {open: "Open", pending: "Order working", closing: "Closing", closed: "Closed", cancelled: "Never filled",
  skipped: "Skipped", would_trade: "Dry run", approved: "Planned", pass: "Passed", blocked_by_fact_check: "Blocked by fact-check", error: "Research error"};
let DATA = null, chart = null, charts = {};

/* theme */
(function () {
  let saved = null; try { saved = localStorage.getItem("desk-theme"); } catch (e) {}
  if (saved) document.documentElement.dataset.theme = saved;
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("desk-theme", next); } catch (e) {}
    if (DATA) render(DATA);
  };
})();

/* tabs */
$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab"); if (!b) return;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t === b));
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== "p-" + b.dataset.tab);
  try { history.replaceState(null, "", "#" + b.dataset.tab); } catch (e) {}
});
function openTab(name) { const b = document.querySelector(`.tab[data-tab="${name}"]`); if (b) b.click(); }

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

async function load() {
  try {
    const r = await fetch("data.json?ts=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    render(DATA);
  } catch (e) {
    $("#status-text").textContent = "Waiting for the bot's first update";
    $("#p-overview").innerHTML = `<p class="empty">The dashboard fills in after the bot's next run (about every 15 minutes). If this stays empty, check that GitHub Actions is turned on for the repo.</p>`;
  }
}

function render(d) {
  const modeText = {live: "Live paper trading", dry_run: "Dry run", paused: "Paused"}[d.mode] || d.mode;
  $("#status").className = "status " + d.mode;
  $("#status-text").textContent = modeText + (d.halted_for_day ? ", daily loss limit hit" : "");

  const a = d.account, dollars = Math.floor(a.equity), cents = Math.round((a.equity - dollars) * 100).toString().padStart(2, "0");
  $("#equity").innerHTML = "$" + dollars.toLocaleString("en-US") + `<span class="cents">.${cents}</span>`;
  const last = d.curve.at(-1), spyRet = last ? (last.spy / a.start - 1) * 100 : null;
  $("#hero-sub").innerHTML = `
    <span><b class="${cls(a.total_return_pct)}">${pct(a.total_return_pct)}</b> since starting with ${money(a.start, 0)}</span>
    <span><b class="${cls(a.today_pct)}">${pct(a.today_pct)}</b> today</span>
    ${spyRet != null ? `<span>S&amp;P 500 over the same time: <b>${pct(spyRet)}</b></span>` : ""}`;
  drawCurve(d.curve);

  renderOverview(d); renderFloor(); renderPositions(d); renderTrades(d); renderPlan(d); renderStats(d); renderGhost(d); renderLearning(d);
  $("#foot").textContent = `Updated ${when(d.generated_at)} New York time. Paper money only. Refreshes every minute.`;
}

function drawCurve(curve) {
  const ctx = $("#curve");
  if (chart) chart.destroy();
  if (!curve.length) return;
  chart = new Chart(ctx, {
    type: "line",
    data: { labels: curve.map(p => p.t), datasets: [
      { data: curve.map(p => p.equity), borderColor: css("--ink"), borderWidth: 2.2, pointRadius: 0, tension: 0.2, fill: false },
      { data: curve.map(p => p.spy), borderColor: css("--spy"), borderWidth: 1.5, pointRadius: 0, tension: 0.2, borderDash: [4, 4] } ] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: {mode: "index", intersect: false},
      plugins: { legend: {display: false}, tooltip: { callbacks: {
        title: (i) => when(i[0].label), label: (i) => (i.datasetIndex ? "S&P 500: " : "Desk: ") + money(i.parsed.y) } } },
      scales: { x: {display: false},
        y: { position: "right", grid: {color: css("--rule")}, border: {display: false},
             ticks: {color: css("--ink-3"), callback: (v) => "$" + (v / 1000).toFixed(1) + "k", maxTicksLimit: 5} } } }
  });
}

function sideTag(t) {
  if (t.asset === "option" || t.expression === "call_options" || t.expression === "put_options") {
    const put = t.option_type === "put" || t.expression === "put_options";
    return `<span class="side ${put ? "short" : "long"}">${put ? "Puts" : "Calls"}</span>`;
  }
  return `<span class="side ${t.direction}">${t.direction === "short" ? "Short" : "Long"}</span>`;
}
function optLine(t) { return t.option_symbol ? `<div class="tag">$${t.strike} ${esc(t.option_type)}s, expire ${esc(t.expiry)}${t.premium_paid ? `, paid $${(+t.premium_paid).toFixed(2)}` : ""}${t.option_mark ? `, now $${(+t.option_mark).toFixed(2)}` : ""}</div>` : ""; }
const sessionName = {morning: "Morning", intraday: "Intraday", evening: "Evening", overnight: "Overnight"};

function renderOverview(d) {
  const a = d.account, s = d.stats, plan = d.plan;
  const recent = d.trades.filter(t => ["open","closed","pending","would_trade"].includes(t.status)).slice(0, 6);
  $("#p-overview").innerHTML = `
    <div class="figures">
      <div class="fig"><div class="v">${a.open_positions}</div><div class="k">Open positions</div></div>
      <div class="fig"><div class="v">${a.trades_today} / ${a.max_trades}</div><div class="k">Trades today</div></div>
      <div class="fig"><div class="v">${money(a.stock_exposure, 0)}</div><div class="k">In stocks, ETFs, crypto</div></div>
      <div class="fig"><div class="v">${money(a.forex_exposure, 0)}</div><div class="k">In forex</div></div>
      <div class="fig"><div class="v ${cls(s.realized_pnl)}">${signed(s.realized_pnl)}</div><div class="k">Realized profit</div></div>
      <div class="fig"><div class="v">${s.win_rate == null ? "—" : s.win_rate + "%"}</div><div class="k">Win rate (${s.closed} closed)</div></div>
    </div>
    ${plan && plan.macro ? `
      <h3>The desk's read on the market</h3>
      <p class="note">${esc(plan.macro.summary)}</p>
      <p class="small muted">${esc(plan.macro.regime)}, aggression ${plan.macro.risk_appetite}/100, from the ${esc(plan.session)} research on ${esc(plan.date)}.
        <button class="link" onclick="openTab('plan')">See the game plan</button></p>` : `<p class="empty">No research yet. The first game plan arrives with the next morning or evening session.</p>`}
    ${(d.sessions_today || []).length ? `<p class="small muted">Research today: ${d.sessions_today.map(x => `${esc(sessionName[x.session] || x.session)} ${when(x.created_at).split(", ").pop()} (${x.approved} of ${x.researched} approved)`).join("; ")}.</p>` : ""}
    <h3>Latest activity</h3>
    ${recent.length ? tradeTable(recent, false) : `<p class="empty">No trades yet. ${d.mode === "dry_run" ? "The desk is in dry-run mode: it researches and logs what it would trade. Send /golive on Telegram to place paper trades." : "Trades appear here as soon as orders go in."}</p>`}`;
}

function renderPositions(d) {
  const rows = d.positions;
  if (!rows.length) { $("#p-positions").innerHTML = `<h2>Positions</h2><p class="empty">Nothing open right now. New positions appear here the moment an order fills.</p>`; return; }
  $("#p-positions").innerHTML = `<h2>Positions</h2><p class="lede">The bar runs from the stop (left) through the entry (middle) to the target (right). For options, prices are the underlying stock's.</p>
  <div class="scroll"><table><thead><tr><th>Symbol</th><th>Status</th><th class="num">Entry</th><th class="num">Now</th><th class="num">Stop</th><th class="num">Target</th><th class="num">Unrealized</th><th>Progress</th></tr></thead><tbody>
  ${rows.map(t => {

/* ---------- trading floor ---------- */
const LIVE_JOBS = ["research", "desk", "client", "learning"];
const RAW = "https://raw.githubusercontent.com/erwannsssss/trading-desk/live/live/";
let LIVE = {}, liveTimer = null, floorOpen = null;
const deskInfo = {
  research: ["Research desk", "Finds trades: scans the market, reads the macro picture, debates every idea"],
  trading: ["Trading desk", "Places orders, enforces the risk limits, manages every open position"],
  learning: ["Learning desk", "Reviews results, runs the tournament and backtests, writes to you"],
};
const ago = (iso) => { if (!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`; };
const clock = (iso) => new Date(iso).toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit"});
const initials = (n) => n.split(" ").map(w => w[0]).join("").slice(0, 2);

async function loadLive() {
  const got = await Promise.all(LIVE_JOBS.map(async j => {
    for (const url of [`${RAW}${j}.json?t=${Date.now()}`, `live/${j}.json?t=${Date.now()}`]) {
      try { const r = await fetch(url, {cache: "no-store"}); if (r.ok) return [j, await r.json()]; } catch (e) {}
    }
    return [j, null];
  }));
  LIVE = Object.fromEntries(got.filter(([, v]) => v));
  renderFloor();
}

function floorState() {
  const agents = {}, events = [];
  const staleCutoff = Date.now() - 25 * 60000;
  for (const job of Object.values(LIVE)) {
    const alive = job.running && new Date(job.updated) > staleCutoff;
    for (const [id, a] of Object.entries(job.agents || {})) {
      const st = {...a, job: job.label};
      if (st.status === "working" && !alive) st.status = "idle";
      if (!agents[id] || (st.since || "") > (agents[id].since || "")) agents[id] = st;
    }
    for (const e of job.events || []) events.push(e);
  }
  events.sort((a, b) => b.t.localeCompare(a.t));
  return {agents, events};
}

function nextUp() {
  const s = (DATA && DATA.schedule) || [];
  const ny = new Date(new Date().toLocaleString("en-US", {timeZone: "America/New_York"}));
  for (let add = 0; add < 8; add++) {
    const day = new Date(ny); day.setDate(ny.getDate() + add);
    const dow = day.getDay();
    const todays = s.filter(x => x.days === "daily" || (x.days === "weekdays" && dow >= 1 && dow <= 5) || (x.days === "sunday" && dow === 0))
      .map(x => { const [h, m] = x.time.split(":").map(Number); const d = new Date(day); d.setHours(h, m, 0, 0); return {...x, at: d}; })
      .filter(x => x.at > ny).sort((a, b) => a.at - b.at);
    if (todays.length) { const x = todays[0];
      return `${x.who} at ${x.at.toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit"})}${add ? (add === 1 ? " tomorrow" : " " + x.at.toLocaleDateString("en-US", {weekday: "long"})) : ""} (New York time)`; }
  }
  return "";
}

function renderFloor() {
  if (!DATA) return;
  const el = $("#p-floor");
  const roster = DATA.roster || [];
  const {agents, events} = floorState();
  const hourAgo = new Date(Date.now() - 3600000).toISOString();
  const recent = events.filter(e => new Date(e.t) > new Date(hourAgo));
  const busy = roster.filter(p => agents[p.id]?.status === "working");
  const running = Object.values(LIVE).filter(j => j.running && new Date(j.updated) > Date.now() - 25 * 60000);
  const newest = Object.values(LIVE).map(j => j.updated).sort().pop();
  const headline = busy.length
    ? `${busy.length} ${busy.length === 1 ? "person is" : "people are"} working: ${running.map(j => esc(j.label)).join(", ")}`
    : `The floor is quiet. Next up: ${esc(nextUp())}`;
  el.innerHTML = `
    <div class="floor-top"><h2>Trading floor</h2>
      <span class="small muted"><span class="livedot ${running.length ? "on" : ""}"></span>${newest ? "Updated " + ago(newest) : "Waiting for the first update"}</span></div>
    <p class="lede">${headline}</p>
    ${["research", "trading", "learning"].map(desk => `
      <div class="desk-block">
        <div class="desk-head"><h3>${deskInfo[desk][0]}</h3><span class="small muted">${deskInfo[desk][1]}</span></div>
        <div class="seats">${roster.filter(p => p.desk === desk).map(p => seat(p, agents[p.id], recent)).join("")}</div>
      </div>`).join("")}
    <div class="feed"><h3>Floor feed, last hour</h3>
      ${recent.length ? recent.slice(0, 80).map(e => feedRow(e, roster)).join("") : `<p class="empty">Nothing in the last hour. ${esc(nextUp() ? "Next up: " + nextUp() + "." : "")}</p>`}
    </div>`;
  if (floorOpen) showPerson(floorOpen, true);
}

function seat(p, a, recent) {
  const working = a?.status === "working";
  const n = recent.filter(e => e.agent === p.id).length;
  const now = working ? `<b>Now:</b> ${esc(a.task)} <span class="muted">(${ago(a.since).replace(" ago", "")})</span>`
    : a?.last ? `${esc(a.last)} <span class="muted">${ago(a.since)}</span>` : `<span class="muted">Hasn't started yet.</span>`;
  return `<button class="seat ${working ? "working" : ""}" data-person="${p.id}" aria-label="${esc(p.name)}, ${esc(p.role)}">
    <span class="avatar ${p.desk}">${initials(p.name)}<span class="st"></span></span>
    <span><span class="seat-name">${esc(p.name)}</span> <span class="seat-role">${esc(p.role)}</span>
      <span class="seat-now">${now}</span>
      ${n ? `<span class="seat-role">${n} thing${n > 1 ? "s" : ""} done in the last hour</span>` : ""}</span></button>`;
}

function feedRow(e, roster) {
  const p = roster.find(r => r.id === e.agent) || {name: e.agent};
  return `<div class="feed-row kind-${esc(e.kind)}"><span class="when">${clock(e.t)}</span>
    <span><span class="who">${esc(p.name)}</span> <span class="what">${esc(e.text)}</span></span></div>`;
}

function showPerson(id, refresh = false) {
  const p = (DATA.roster || []).find(r => r.id === id); if (!p) return;
  floorOpen = id;
  const {agents, events} = floorState();
  const a = agents[id] || {};
  const mine = events.filter(e => e.agent === id);
  const hourAgo = Date.now() - 3600000;
  const hour = mine.filter(e => new Date(e.t) > hourAgo), earlier = mine.filter(e => new Date(e.t) <= hourAgo);
  const list = (rows) => rows.map(e => `<div class="feed-row kind-${esc(e.kind)}"><span class="when">${clock(e.t)}</span><span class="what note" style="font-size:15px">${esc(e.text)}</span></div>`).join("");
  $("#memo-body").innerHTML = `
    <div class="memo-top"><div style="display:flex;gap:12px;align-items:center">
      <span class="avatar ${p.desk}" style="width:48px;height:48px">${initials(p.name)}</span>
      <div><h2>${esc(p.name)}</h2><div class="small muted">${esc(p.role)}, ${esc(deskInfo[p.desk][0])}</div></div></div>
      <button class="close" onclick="this.closest('dialog').close()">Close</button></div>
    <h3>Right now</h3>
    <p class="note">${a.status === "working" ? `Working on: ${esc(a.task)} (started ${ago(a.since)})` : `Between tasks. ${a.last ? "Last: " + esc(a.last) : ""}`}</p>
    <h3>Last hour (${hour.length})</h3>${hour.length ? list(hour) : `<p class="small muted">Nothing in the last hour.</p>`}
    ${earlier.length ? `<h3>Earlier</h3>${list(earlier.slice(0, 60))}` : ""}`;
  if (!refresh || !$("#memo").open) $("#memo").showModal();
}
$("#memo").addEventListener("close", () => { floorOpen = null; });
document.addEventListener("click", (e) => { const s = e.target.closest("[data-person]"); if (s) showPerson(s.dataset.person); });

function startLive() { if (!liveTimer) { loadLive(); liveTimer = setInterval(loadLive, 20000); } }

openTab((location.hash || "#overview").slice(1));
load().then(startLive);
setInterval(load, 60000);
</script>
</body>
</html>
