name: Research team

# Morning: full research before the US open (11:40 UTC = 7:40am New York in summer, 6:40am in winter).
# Evening: crypto + forex after the close (22:10 UTC = 6:10pm New York in summer), every day incl. weekends.
on:
  schedule:
    - cron: "40 11 * * 1-5"
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      session:
        description: "morning (everything) or evening (crypto + forex)"
        default: morning
        type: choice
        options: [morning, evening]

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick session
        id: s
        run: |
          if [ -n "${{ inputs.session }}" ]; then echo "session=${{ inputs.session }}" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "10 22 * * *" ]; then echo "session=evening" >> "$GITHUB_OUTPUT";
          else echo "session=morning" >> "$GITHUB_OUTPUT"; fi
      - name: Research
        run: python -m desk.main research ${{ steps.s.outputs.session }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Save the game plan
        if: always()
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "trading-desk-bot@users.noreply.github.com"
          git add data/plans docs
          [ -d data/cache ] && git add data/cache
          git diff --cached --quiet && exit 0
          git commit -m "Research ${{ steps.s.outputs.session }} $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 5; done
