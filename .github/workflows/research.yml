name: Research team

# All times UTC. New York is UTC-4 in summer, UTC-5 in winter.
#   morning    11:40 weekdays            full team before the open (7:40am NY summer)
#   intraday   14:20 15:50 17:20 18:50   fast scans while the market is open (10:20am-2:50pm NY summer)
#   evening    22:10 daily               full team on crypto + forex (6:10pm NY summer)
#   overnight  02:10 06:10 daily         fast crypto + forex scans
on:
  schedule:
    - cron: "40 11 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "50 15 * * 1-5"
    - cron: "20 17 * * 1-5"
    - cron: "50 18 * * 1-5"
    - cron: "10 22 * * *"
    - cron: "10 2,6 * * *"
  workflow_dispatch:
    inputs:
      session:
        description: "Which session to run"
        default: morning
        type: choice
        options: [morning, intraday, evening, overnight]

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-research.txt
      - name: Pick session
        id: s
        run: |
          case "${{ github.event.schedule }}" in
            "40 11 * * 1-5") s=morning ;;
            "10 22 * * *") s=evening ;;
            "10 2,6 * * *") s=overnight ;;
            "") s="${{ inputs.session }}" ;;
            *) s=intraday ;;
          esac
          echo "session=${s:-morning}" >> "$GITHUB_OUTPUT"
      - name: Research
        run: python -m desk.main research ${{ steps.s.outputs.session }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save the game plan
        if: always()
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "trading-desk-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "Research ${{ steps.s.outputs.session }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 5; done
