<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erwann's Trading Desk</title>
<meta name="description" content="Live view of an autonomous AI paper-trading desk: account value, positions, trades and the research behind them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --paper: #EEF2F5;
  --sheet: #F8FAFB;
  --ink: #16233F;
  --ink-2: #4A5772;
  --ink-3: #7D889E;
  --rule: #D5DCE4;
  --gain: #0E7A5C;
  --loss: #B3263E;
  --signal: #E8B425;
  --spy: #9AA6B8;
  --font-data: "Archivo", system-ui, sans-serif;
  --font-note: "Source Serif 4", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101A2E; --sheet: #16223A; --ink: #E7ECF3; --ink-2: #B4BFD0; --ink-3: #7F8BA1;
    --rule: #26334D; --gain: #3CC498; --loss: #F0657C; --spy: #5D6B84;
  }
}
:root[data-theme="dark"] {
  --paper: #101A2E; --sheet: #16223A; --ink: #E7ECF3; --ink-2: #B4BFD0; --ink-3: #7F8BA1;
  --rule: #26334D; --gain: #3CC498; --loss: #F0657C; --spy: #5D6B84;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-data); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums; font-variation-settings: "wdth" 100;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 8px; }
.desk { font-weight: 700; font-variation-settings: "wdth" 112; letter-spacing: -0.01em; font-size: 16px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
@media (max-width: 560px) {
  .desk { font-size: 14px; }
  .theme { display: none; }
  .hide-sm { display: none; }
  td, th { padding-right: 8px; }
}
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); }
.status.live .dot { background: var(--gain); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gain) 18%, transparent); }
.status.dry_run .dot, .status.paused .dot { background: var(--signal); }
.theme { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 13px; color: var(--ink-2); }

/* hero: the one loud thing */
.hero { padding: 20px 0 0; }
.equity { font-size: clamp(52px, 13vw, 128px); line-height: 0.92; font-weight: 800; letter-spacing: -0.035em;
  font-variation-settings: "wdth" 125; margin: 0; }
.equity .cents { font-size: 0.42em; font-weight: 600; letter-spacing: -0.01em; color: var(--ink-2); }
.hero-sub { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; font-size: 15px; color: var(--ink-2); }
.hero-sub b { font-weight: 700; color: var(--ink); }
.tape { position: relative; height: 210px; margin: 18px 0 4px; }
.legend { display: flex; gap: 18px; font-size: 12.5px; color: var(--ink-3); }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.up { color: var(--gain); } .down { color: var(--loss); }

/* tabs */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule);
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 18px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 12px 12px 11px; cursor: pointer; white-space: nowrap; color: var(--ink-3);
  font-weight: 600; border-bottom: 2.5px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.panel { padding: 22px 0 60px; }
.panel[hidden] { display: none; }

h2 { font-size: 21px; font-weight: 700; font-variation-settings: "wdth" 108; letter-spacing: -0.015em; margin: 0 0 4px; }
h3 { font-size: 15px; font-weight: 700; margin: 26px 0 8px; }
.lede { color: var(--ink-2); margin: 0 0 16px; max-width: 70ch; }
.note { font-family: var(--font-note); font-size: 16px; line-height: 1.6; max-width: 68ch; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }

/* key figures row: deliberately plain, not cards */
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--rule); }
.fig { padding: 12px 14px 12px 0; border-bottom: 1px solid var(--rule); }
.fig .v { font-size: 22px; font-weight: 700; font-variation-settings: "wdth" 110; }
.fig .k { font-size: 12.5px; color: var(--ink-3); }

/* tables */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 12.5px; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 11px 10px 11px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.num, th.num { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.sym { font-weight: 700; font-variation-settings: "wdth" 110; }
.side { font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }
.side.long { color: var(--gain); } .side.short { color: var(--loss); }
.tag { font-size: 12.5px; color: var(--ink-2); }

/* progress from stop to target */
.track { position: relative; height: 6px; background: var(--rule); border-radius: 3px; min-width: 110px; margin-top: 7px; }
.track span { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.track .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1.5px; background: var(--ink-3); }

/* plan ideas: a list, not cards */
.idea { padding: 16px 0; border-bottom: 1px solid var(--rule); }
.idea-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.idea-levels { margin-top: 6px; font-size: 14px; color: var(--ink-2); }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 600; font-size: 14px; }
.pill { font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink-2); }

.empty { padding: 28px 0; color: var(--ink-2); max-width: 60ch; }
.two { display: grid; gap: 28px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .two { grid-template-columns: 1fr 1fr; } }
.box-chart { position: relative; height: 230px; }

/* memo drawer */
dialog { border: 0; padding: 0; width: min(760px, 100vw); max-height: 100vh; height: 100vh; margin: 0 0 0 auto;
  background: var(--sheet); color: var(--ink); box-shadow: -12px 0 40px rgba(16,26,46,.25); }
dialog::backdrop { background: rgba(16,26,46,.45); }
.memo { padding: 22px 22px 60px; }
.memo-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; position: sticky; top: 0; background: var(--sheet); padding: 6px 0 12px; border-bottom: 1px solid var(--rule); }
.close { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.memo h3 { margin-top: 24px; }
.memo ul { margin: 6px 0 0; padding-left: 20px; }
.memo li { margin: 4px 0; }
.score { font-weight: 700; }
.check-ok { color: var(--gain); font-weight: 600; } .check-bad { color: var(--loss); font-weight: 600; }

/* trading floor */
.floor-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 18px; margin-bottom: 6px; }
.livedot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); margin-right: 6px; vertical-align: middle; }
.livedot.on { background: var(--gain); }
.desk-block { margin-top: 26px; }
.desk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.desk-head h3 { margin: 0; font-size: 17px; font-variation-settings: "wdth" 110; }
.seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0 22px; }
.seat { display: grid; grid-template-columns: 40px 1fr; gap: 10px; padding: 13px 4px 13px 0; border-bottom: 1px solid var(--rule);
  background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; cursor: pointer; width: 100%; }
.seat:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px;
  font-variation-settings: "wdth" 115; position: relative; }
.avatar.research { background: var(--ink); color: var(--paper); }
.avatar.trading { background: var(--gain); color: var(--paper); }
.avatar.learning { background: var(--signal); color: #16233F; }
.avatar .face { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); border-radius: 50%; object-fit: cover; background: var(--paper); }
.avatar { overflow: visible; }
.avatar .st { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--paper); background: var(--ink-3); }
.seat.working .avatar .st { background: var(--signal); }
@media (prefers-reduced-motion: no-preference) { .seat.working .avatar .st { animation: pulse 1.4s ease-in-out infinite; } }
@keyframes pulse { 50% { transform: scale(1.35); } }
.seat-name { font-weight: 700; font-size: 14.5px; }
.seat-role { font-size: 12.5px; color: var(--ink-3); display: block; }
.seat-now { font-size: 13.5px; margin-top: 5px; line-height: 1.4; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.seat.working .seat-now { color: var(--ink); }
.seat-now b { font-weight: 700; }
.feed { margin-top: 30px; }
.feed-row { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.feed-row .when { color: var(--ink-3); font-size: 12.5px; padding-top: 1px; }
.feed-row .who { font-weight: 700; }
.kind-blocked .what, .kind-error .what { color: var(--loss); }
.kind-trade .what, .kind-decision .what { color: var(--ink); }

/* org chart */
.org { margin-top: 18px; }
.org-level { display: flex; justify-content: center; gap: 18px; position: relative; }
.org-stem { width: 2px; height: 22px; background: var(--rule); margin: 0 auto; }
.branch { display: flex; gap: 16px; position: relative; padding-top: 22px; }
.branch::before { content: ""; position: absolute; top: 0; left: var(--l, 10%); right: var(--r, 10%); height: 2px; background: var(--rule); }
.twig { position: relative; flex: 1; min-width: 0; }
.twig::before { content: ""; position: absolute; top: -22px; left: 50%; width: 2px; height: 22px; background: var(--rule); }
.person { display: grid; grid-template-columns: 36px 1fr; gap: 9px; align-items: start; padding: 10px 12px; width: 100%; text-align: left;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; cursor: pointer; }
.person:hover { border-color: var(--ink-3); }
.person.head { border-color: var(--ink); }
.person.partner { background: var(--ink); color: var(--paper); border-color: var(--ink); max-width: 340px; }
.person.partner .seat-role, .person.partner .seat-now { color: color-mix(in srgb, var(--paper) 75%, transparent); }
.person .avatar { width: 36px; height: 36px; font-size: 13px; }
.person.partner .avatar { background: var(--signal); color: #16233F; }
.avatar.leadership { background: var(--ink-2); color: var(--paper); }
.avatar.partner { background: var(--signal); color: #16233F; }
.avatar.intern { background: transparent; color: var(--ink); border: 2px dashed var(--ink-3); }
.person.working .avatar .st { background: var(--signal); }
@media (prefers-reduced-motion: no-preference) { .person.working .avatar .st { animation: pulse 1.4s ease-in-out infinite; } }
.hit { display: inline-block; margin-top: 4px; font-size: 12.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink-2); }
.hit.good { background: color-mix(in srgb, var(--gain) 14%, transparent); color: var(--gain); }
.hit.bad { background: color-mix(in srgb, var(--loss) 12%, transparent); color: var(--loss); }
.person .seat-now { -webkit-line-clamp: 2; font-size: 13px; }
.desk-col { display: flex; flex-direction: column; gap: 8px; }
.stem-cio { margin: 0 0 0 calc(16.67% - 6px); }
.branch.desks .twig::before { left: 50%; }
.desk-col .desk-name { font-weight: 700; font-size: 13px; color: var(--ink-3); margin: 2px 0 2px 2px; }
.members { display: grid; gap: 8px; padding-left: 14px; border-left: 2px solid var(--rule); margin-left: 18px; }
.members.two { grid-template-columns: 1fr 1fr; }
.intern-bar { height: 6px; background: var(--rule); border-radius: 3px; margin-top: 6px; position: relative; overflow: hidden; }
.intern-bar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--ink); }
@media (max-width: 860px) {
  .branch { flex-direction: column; padding-top: 0; padding-left: 16px; border-left: 2px solid var(--rule); margin-left: 18px; }
  .branch::before, .twig::before { display: none; }
  .org-level { flex-direction: column; align-items: stretch; }
  .members.two { grid-template-columns: 1fr; }
  .person.partner { max-width: none; }
}
/* glossary + explain */
abbr.g { text-decoration: underline dotted var(--ink-3); text-underline-offset: 3px; cursor: help; }
.gpop { position: absolute; z-index: 50; max-width: 280px; background: var(--ink); color: var(--paper); font-size: 13.5px; line-height: 1.45;
  padding: 9px 12px; border-radius: 8px; box-shadow: 0 6px 24px rgba(16,26,46,.25); }
.gpop b { display: block; margin-bottom: 2px; }
.eli { margin: 10px 0; padding: 12px 14px; border-left: 3px solid var(--signal); background: color-mix(in srgb, var(--signal) 10%, transparent); }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.cards-grid img { width: 100%; border-radius: 8px; border: 1px solid var(--rule); }

/* luck or skill */
.verdict { padding: 18px 0 6px; }
.verdict .big { font-size: clamp(30px, 6vw, 52px); font-weight: 800; font-variation-settings: "wdth" 118; letter-spacing: -0.02em; line-height: 1; }
.verdict.edge .big { color: var(--gain); }
.verdict.no_edge .big { color: var(--loss); }
.meter { position: relative; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--rule), var(--rule)); margin: 16px 0 6px; max-width: 560px; }
.meter i { position: absolute; top: -5px; width: 4px; height: 20px; border-radius: 2px; background: var(--ink); }
.meter-labels { display: flex; justify-content: space-between; max-width: 560px; font-size: 12.5px; color: var(--ink-3); }
.chart-box { position: relative; height: 260px; margin-top: 6px; }
.chart-note { font-size: 13px; color: var(--ink-2); max-width: 70ch; margin: 4px 0 0; }

/* heatmap + bank */
.heat-toggle { display: inline-flex; gap: 4px; margin-left: 10px; }
.heat-toggle button { border: 1px solid var(--rule); background: none; border-radius: 6px; padding: 3px 9px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.heat-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.heat-group { margin-top: 12px; }
.heat-group .desk-name { display: block; margin-bottom: 6px; }
.heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.tile { border-radius: 8px; padding: 9px 10px; min-height: 66px; border: 1px solid var(--rule); }
.tile .tsym { font-weight: 700; font-size: 13.5px; }
.tile .tname { font-size: 12px; color: var(--ink-2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .tval { font-weight: 700; font-size: 15px; margin-top: 3px; display: block; }
.bankbar { height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; max-width: 360px; margin-top: 6px; }
.bankbar span { display: block; height: 100%; background: var(--ink); }
footer { color: var(--ink-3); font-size: 12.5px; padding: 0 0 40px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="desk">Erwann's Trading Desk</div>
    <div style="display:flex;gap:12px;align-items:center">
      <span class="status" id="status"><span class="dot"></span><span id="status-text">Loading</span></span>
      <button class="theme" id="theme" aria-label="Switch light or dark theme">Theme</button>
    </div>
  </header>

  <section class="hero" aria-label="Account value">
    <p class="equity" id="equity">$—</p>
    <div class="hero-sub" id="hero-sub"></div>
    <div class="tape"><canvas id="curve" aria-label="Account value compared with the S&P 500"></canvas></div>
    <div class="legend"><span><i style="background:var(--ink)"></i>The desk</span><span><i style="background:var(--spy)"></i>S&amp;P 500, same $10,000</span></div>
  </section>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button class="tab" role="tab" data-tab="floor">Trading floor</button>
    <button class="tab" role="tab" data-tab="positions">Positions</button>
    <button class="tab" role="tab" data-tab="trades">Trade log</button>
    <button class="tab" role="tab" data-tab="plan">Today's game plan</button>
    <button class="tab" role="tab" data-tab="stats">Performance</button>
    <button class="tab" role="tab" data-tab="edge">Luck or skill?</button>
    <button class="tab" role="tab" data-tab="ghost">Passed ideas</button>
    <button class="tab" role="tab" data-tab="learning">Lessons</button>
  </nav>

  <main>
    <section class="panel" id="p-overview"></section>
    <section class="panel" id="p-floor" hidden></section>
    <section class="panel" id="p-positions" hidden></section>
    <section class="panel" id="p-trades" hidden></section>
    <section class="panel" id="p-plan" hidden></section>
    <section class="panel" id="p-stats" hidden></section>
    <section class="panel" id="p-edge" hidden></section>
    <section class="panel" id="p-ghost" hidden></section>
    <section class="panel" id="p-learning" hidden></section>
  </main>
  <footer id="foot"></footer>
</div>

<dialog id="memo" aria-label="Research memo"><div class="memo" id="memo-body"></div></dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (x, d = 2) => x == null ? "—" : (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const signed = (x, d = 2) => x == null ? "—" : (x > 0 ? "+" : x < 0 ? "-" : "") + money(Math.abs(x), d).replace("-", "");
const pct = (x, d = 2) => x == null ? "—" : (x > 0 ? "+" : "") + x.toFixed(d) + "%";
const cls = (x) => x > 0 ? "up" : x < 0 ? "down" : "";
const px = (x) => x == null ? "—" : (Math.abs(x) >= 10 ? x.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}) : Math.abs(x) >= 0.01 ? (+x).toFixed(4) : (+x).toPrecision(4));
const when = (iso) => iso ? new Date(iso).toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}) : "—";
const assetName = {stock: "Stock", etf: "ETF", crypto: "Crypto", forex: "Forex", option: "Options"};
const statusName = {open: "Open", pending: "Order working", closing: "Closing", closed: "Closed", cancelled: "Never filled",
  skipped: "Skipped", would_trade: "Dry run", approved: "Planned", pass: "Passed", blocked_by_fact_check: "Blocked by fact-check", error: "Research error"};
let DATA = null, chart = null, charts = {};

/* theme */
(function () {
  let saved = null; try { saved = localStorage.getItem("desk-theme"); } catch (e) {}
  if (saved) document.documentElement.dataset.theme = saved;
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("desk-theme", next); } catch (e) {}
    if (DATA) render(DATA);
  };
})();

/* tabs */
$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab"); if (!b) return;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t === b));
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== "p-" + b.dataset.tab);
  try { history.replaceState(null, "", "#" + b.dataset.tab); } catch (e) {}
});
function openTab(name) { const b = document.querySelector(`.tab[data-tab="${name}"]`); if (b) b.click(); }

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

async function load() {
  try {
    const r = await fetch("data.json?ts=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    render(DATA);
  } catch (e) {
    $("#status-text").textContent = "Waiting for the bot's first update";
    $("#p-overview").innerHTML = `<p class="empty">The dashboard fills in after the bot's next run (about every 15 minutes). If this stays empty, check that GitHub Actions is turned on for the repo.</p>`;
  }
}

function render(d) {
  const modeText = {live: "Live paper trading", dry_run: "Dry run", paused: "Paused"}[d.mode] || d.mode;
  $("#status").className = "status " + d.mode;
  $("#status-text").textContent = modeText + (d.halted_for_day ? ", daily loss limit hit" : "");

  const a = d.account, dollars = Math.floor(a.equity), cents = Math.round((a.equity - dollars) * 100).toString().padStart(2, "0");
  $("#equity").innerHTML = "$" + dollars.toLocaleString("en-US") + `<span class="cents">.${cents}</span>`;
  const last = d.curve.at(-1), spyRet = last ? (last.spy / a.start - 1) * 100 : null;
  $("#hero-sub").innerHTML = `
    <span><b class="${cls(a.total_return_pct)}">${pct(a.total_return_pct)}</b> since starting with ${money(a.start, 0)}</span>
    <span><b class="${cls(a.today_pct)}">${pct(a.today_pct)}</b> today</span>
    ${spyRet != null ? `<span>S&amp;P 500 over the same time: <b>${pct(spyRet)}</b></span>` : ""}`;
  drawCurve(d.curve);

  renderOverview(d); renderFloor(); renderPositions(d); renderTrades(d); renderPlan(d); renderStats(d); renderEdge(d); renderGhost(d); renderLearning(d);
  $("#foot").textContent = `Updated ${when(d.generated_at)} New York time. Paper money only. Refreshes every minute.`;
  document.querySelectorAll("main .panel").forEach(gloss);
}

function drawCurve(curve) {
  const ctx = $("#curve");
  if (chart) chart.destroy();
  if (!curve.length) return;
  chart = new Chart(ctx, {
    type: "line",
    data: { labels: curve.map(p => p.t), datasets: [
      { data: curve.map(p => p.equity), borderColor: css("--ink"), borderWidth: 2.2, pointRadius: 0, tension: 0.2, fill: false },
      { data: curve.map(p => p.spy), borderColor: css("--spy"), borderWidth: 1.5, pointRadius: 0, tension: 0.2, borderDash: [4, 4] } ] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: {mode: "index", intersect: false},
      plugins: { legend: {display: false}, tooltip: { callbacks: {
        title: (i) => when(i[0].label), label: (i) => (i.datasetIndex ? "S&P 500: " : "Desk: ") + money(i.parsed.y) } } },
      scales: { x: {display: false},
        y: { position: "right", grid: {color: css("--rule")}, border: {display: false},
             ticks: {color: css("--ink-3"), callback: (v) => "$" + (v / 1000).toFixed(1) + "k", maxTicksLimit: 5} } } }
  });
}

function sideTag(t) {
  if (t.asset === "option" || t.expression === "call_options" || t.expression === "put_options") {
    const put = t.option_type === "put" || t.expression === "put_options";
    return `<span class="side ${put ? "short" : "long"}">${put ? "Puts" : "Calls"}</span>`;
  }
  return `<span class="side ${t.direction}">${t.direction === "short" ? "Short" : "Long"}</span>`;
}
function optLine(t) { return t.option_symbol ? `<div class="tag">$${t.strike} ${esc(t.option_type)}s, expire ${esc(t.expiry)}${t.premium_paid ? `, paid $${(+t.premium_paid).toFixed(2)}` : ""}${t.option_mark ? `, now $${(+t.option_mark).toFixed(2)}` : ""}</div>` : ""; }
const sessionName = {morning: "Morning", intraday: "Intraday", evening: "Evening", overnight: "Overnight"};

function renderOverview(d) {
  const a = d.account, s = d.stats, plan = d.plan;
  const recent = d.trades.filter(t => ["open","closed","pending","would_trade"].includes(t.status)).slice(0, 6);
  $("#p-overview").innerHTML = `
    <div class="figures">
      <div class="fig"><div class="v">${a.open_positions}</div><div class="k">Open positions</div></div>
      <div class="fig"><div class="v">${a.trades_today} / ${a.max_trades}</div><div class="k">Trades today</div></div>
      <div class="fig"><div class="v">${money(a.stock_exposure, 0)}</div><div class="k">In stocks, ETFs, crypto</div></div>
      <div class="fig"><div class="v">${money(a.forex_exposure, 0)}</div><div class="k">In forex</div></div>
      <div class="fig"><div class="v ${cls(s.realized_pnl)}">${signed(s.realized_pnl)}</div><div class="k">Realized profit</div></div>
      <div class="fig"><div class="v">${s.win_rate == null ? "—" : s.win_rate + "%"}</div><div class="k">Win rate (${s.closed} closed)</div></div>
    </div>
    ${d.bank ? `<h3>Bank credit line</h3>
      <p class="small">Borrowed <b>${money(d.bank.borrowed, 0)}</b> of ${money(d.bank.credit_line, 0)} from ${esc(d.bank.bank)} at ${d.bank.apr_pct}% a year.
        Interest so far: <b>${money(d.bank.financing_cost)}</b> (${money(d.bank.interest_paid)} repaid with closed trades, ${money(d.bank.interest_accruing)} building on open ones).</p>
      <div class="bankbar" role="img" aria-label="${Math.round(d.bank.borrowed / d.bank.credit_line * 100)}% of the credit line in use"><span style="width:${Math.min(100, d.bank.borrowed / d.bank.credit_line * 100)}%"></span></div>` : ""}
    ${d.sectors ? `<h3>Where the money is moving <span class="heat-toggle" role="group" aria-label="Time frame">
        ${[["ret_1d", "1 day"], ["ret_5d", "1 week"], ["ret_20d", "1 month"]].map(([k, l]) => `<button data-heat="${k}" aria-pressed="${HEAT === k}">${l}</button>`).join("")}</span></h3>
      <p class="small muted">From the ${esc(d.sectors.session)} research, ${when(d.sectors.as_of)}. Green is up, red is down; the number and arrow say how much.</p>
      ${d.sectors.groups.map(g => `<div class="heat-group"><span class="desk-name">${esc(g.title)}</span><div class="heat">${g.tiles.map(tile).join("")}</div></div>`).join("")}` : ""}
    ${plan && plan.macro ? `
      <h3>The desk's read on the market</h3>
      <p class="note">${esc(plan.macro.summary)}</p>
      <p class="small muted">${esc(plan.macro.regime)}, aggression ${plan.macro.risk_appetite}/100, from the ${esc(plan.session)} research on ${esc(plan.date)}.
        <button class="link" onclick="openTab('plan')">See the game plan</button></p>` : `<p class="empty">No research yet. The first game plan arrives with the next morning or evening session.</p>`}
    ${(d.sessions_today || []).length ? `<p class="small muted">Research today: ${d.sessions_today.map(x => `${esc(sessionName[x.session] || x.session)} ${when(x.created_at).split(", ").pop()} (${x.approved} of ${x.researched} approved)`).join("; ")}.</p>` : ""}
    <h3>Latest activity</h3>
    ${recent.length ? tradeTable(recent, false) : `<p class="empty">No trades yet. ${d.mode === "dry_run" ? "The desk is in dry-run mode: it researches and logs what it would trade. Send /golive on Telegram to place paper trades." : "Trades appear here as soon as orders go in."}</p>`}`;
}

let HEAT = "ret_1d";
function tile(t) {
  const v = t[HEAT];
  const scale = {ret_1d: 3, ret_5d: 6, ret_20d: 12}[HEAT];
  const a = v == null ? 0 : Math.min(1, Math.abs(v) / scale);
  const base = v == null ? "transparent" : v >= 0 ? css("--gain") : css("--loss");
  const bg = v == null ? "transparent" : `color-mix(in srgb, ${base} ${Math.round(8 + a * 52)}%, transparent)`;
  return `<div class="tile" style="background:${bg}" title="${esc(t.name)}: 1 day ${pct(t.ret_1d)}, 1 week ${pct(t.ret_5d)}, 1 month ${pct(t.ret_20d)}">
    <span class="tsym">${esc(t.symbol)}</span><span class="tname">${esc(t.name)}</span>
    <span class="tval">${v == null ? "—" : (v >= 0 ? "▲ +" : "▼ ") + v.toFixed(1) + "%"}</span></div>`;
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-heat]"); if (!b || !DATA) return; HEAT = b.dataset.heat; renderOverview(DATA); gloss($("#p-overview")); });

function renderPositions(d) {
  const rows = d.positions;
  if (!rows.length) { $("#p-positions").innerHTML = `<h2>Positions</h2><p class="empty">Nothing open right now. New positions appear here the moment an order fills.</p>`; return; }
  $("#p-positions").innerHTML = `<h2>Positions</h2><p class="lede">The bar runs from the stop (left) through the entry (middle) to the target (right). For options, prices are the underlying stock's.</p>
  <div class="scroll"><table><thead><tr><th>Symbol</th><th>Status</th><th class="num">Entry</th><th class="num">Now</th><th class="num">Stop</th><th class="num">Target</th><th class="num">Unrealized</th><th>Progress</th></tr></thead><tbody>
  ${rows.map(t => {
    const p = t.progress ?? 0, w = Math.abs(p) * 50;
    const bar = p >= 0 ? `<span style="left:50%;width:${w}%;background:var(--gain)"></span>` : `<span style="left:${50 - w}%;width:${w}%;background:var(--loss)"></span>`;
    return `<tr class="click" data-memo="${esc(t.plan_file)}|${esc(t.symbol)}">
      <td><span class="sym">${esc(t.symbol)}</span> ${sideTag(t)}<div class="tag">${esc(assetName[t.asset])}, ${esc(t.style || "")}</div>${optLine(t)}</td>
      <td>${esc(statusName[t.status])}</td>
      <td class="num">${px(t.asset === "option" ? (t.underlying_entry ?? t.entry_plan) : (t.entry_price ?? t.entry_plan))}</td><td class="num">${px(t.last_price)}</td>
      <td class="num">${px(t.stop)}</td><td class="num">${px(t.target)}</td>
      <td class="num ${cls(t.unrealized_usd)}">${signed(t.unrealized_usd)}</td>
      <td><div class="track"><div class="mid"></div>${bar}</div></td></tr>`; }).join("")}
  </tbody></table></div>`;
}

function tradeTable(rows, full = true) {
  return `<div class="scroll"><table><thead><tr><th>Symbol</th><th>Status</th><th class="hide-sm">Opened</th><th class="num">Entry</th><th class="num hide-sm">Exit</th><th class="num">Profit</th>${full ? '<th class="hide-sm">Why it ended</th>' : ""}</tr></thead><tbody>
  ${rows.map(t => `<tr class="click" data-memo="${esc(t.plan_file)}|${esc(t.symbol)}">
    <td><span class="sym">${esc(t.symbol)}</span> ${t.direction === "pass" ? "" : sideTag(t)}<div class="tag">${esc(assetName[t.asset] || "")}${t.bucket ? ", " + esc(t.bucket) : ""}${t.conviction ? ", conviction " + t.conviction + "/10" : ""}</div></td>
    <td>${esc(statusName[t.status] || t.status)}</td>
    <td class="small hide-sm">${when(t.opened_at || t.created_at)}</td>
    <td class="num">${px(t.entry_price ?? t.entry_plan)}</td><td class="num hide-sm">${px(t.exit_price)}</td>
    <td class="num ${cls(t.pnl_usd)}">${t.pnl_usd == null ? "—" : signed(t.pnl_usd) + (t.r_result != null ? `<div class="tag">${t.r_result}R</div>` : "")}</td>
    ${full ? `<td class="small hide-sm">${esc(t.exit_reason || t.skip_reason || "")}</td>` : ""}</tr>`).join("")}
  </tbody></table></div>`;
}

function renderTrades(d) {
  const rows = d.trades;
  $("#p-trades").innerHTML = `<h2>Trade log</h2><p class="lede">Every trade the desk planned, placed, skipped or closed. Tap any row to read the full research behind it.</p>
    ${rows.length ? tradeTable(rows) : `<p class="empty">The log starts with the first trade the desk takes.</p>`}`;
}

function renderPlan(d) {
  const p = d.plan;
  if (!p) { $("#p-plan").innerHTML = `<h2>Today's game plan</h2><p class="empty">The research team runs at 7:40am New York time on weekdays, scans again through the trading day, and covers crypto and forex every evening and overnight. Its plan shows up here.</p>`; return; }
  const m = p.macro || {}, w = m.bucket_weights || {};
  const approved = p.ideas.filter(i => i.status === "approved").sort((a, b) => (b.conviction || 0) - (a.conviction || 0));
  const others = p.ideas.filter(i => i.status !== "approved");
  $("#p-plan").innerHTML = `
    <h2>${p.session === "morning" ? "Morning" : "Evening"} game plan for ${esc(p.date)}</h2>
    ${p.later_sessions ? `<p class="small muted">Plus ${p.later_sessions} faster scan${p.later_sessions > 1 ? "s" : ""} since then; their ideas are included below.</p>` : ""}
    <p class="lede">${esc(m.regime)}. Aggression ${m.risk_appetite}/100. Money split: core ${w.core}%, tactical ${w.tactical}%, high-risk ${w.high_risk}%.</p>
    <p class="note">${esc(m.summary)}</p>
    ${m.overnight_read ? `<p class="note"><b>Overnight:</b> ${esc(m.overnight_read)}</p>` : ""}
    <div class="two">
      <div><h3>Plays that should work</h3><ul class="small">${(m.playbook?.use || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
           <h3>Plays to avoid</h3><ul class="small">${(m.playbook?.avoid || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <div><h3>Coming up</h3><ul class="small">${(p.calendar || []).slice(0, 8).map(e => `<li>${esc(e.date)}: ${esc(e.event)}</li>`).join("") || "<li>Nothing scheduled</li>"}</ul>
           <h3>Watching</h3><ul class="small">${(m.key_events || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>
    <h3>Trades in the plan (${approved.length})</h3>
    ${approved.map(i => `<div class="idea">
      <div class="idea-head"><span class="sym" style="font-size:18px">${esc(i.symbol)}</span> ${sideTag({direction: i.decision, expression: i.expression})}
        <span class="pill">${esc(i.bucket)}</span><span class="pill">${esc(i.style)}</span><span class="tag">conviction ${i.conviction}/10</span>
        <span class="tag">${esc(sessionName[i.session] || "")} ${when(i.at).split(", ").pop()}</span></div>
      <div class="idea-levels">Entry ${px(i.entry)}, stop ${px(i.stop)}, target ${px(i.target)}. Reward is ${i.reward_to_risk}x the risk.
        ${i.sizing ? ` Size ${money(i.sizing.notional_usd, 0)}, risking ${money(i.sizing.risk_usd, 0)}.` : ""}</div>
      <p class="note" style="margin:8px 0 6px">${esc(i.thesis)}</p>
      ${i.plain_english ? `<div class="eli note" id="eli-${esc(i.memo_key).replace(/[^a-z0-9]/gi, "")}" hidden>${esc(i.plain_english)}</div>` : ""}
      <button class="link" data-memo="${esc(i.memo_key)}">Read the research</button>
      ${i.plain_english ? `&nbsp;&nbsp;<button class="link" data-eli="eli-${esc(i.memo_key).replace(/[^a-z0-9]/gi, "")}">Explain like I'm new</button>` : ""}</div>`).join("") || `<p class="empty">The desk found no trade worth taking in this session.</p>`}
    <h3>Researched but not traded (${others.length})</h3>
    <div class="scroll"><table><thead><tr><th>Symbol</th><th>Outcome</th><th>Reason</th></tr></thead><tbody>
    ${others.map(i => `<tr class="click" data-memo="${esc(i.memo_key)}"><td class="sym">${esc(i.symbol)}</td><td>${esc(statusName[i.status] || i.status)}</td>
      <td class="small">${esc(i.reason || (i.problems || [])[0] || i.error || "")}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="small muted">Researched ${p.ideas.length} finalists with ${p.ai_calls} AI calls in ${p.minutes} minutes.</p>`;
}

function renderStats(d) {
  const s = d.stats;
  const group = (rows, title) => rows.length ? `<div><h3>${title}</h3><div class="scroll"><table><thead><tr><th>Group</th><th class="num">Trades</th><th class="num">Win rate</th><th class="num">Profit</th></tr></thead><tbody>
    ${rows.map(g => `<tr><td>${esc(g.name)}</td><td class="num">${g.trades}</td><td class="num">${g.win_rate}%</td><td class="num ${cls(g.pnl)}">${signed(g.pnl)}</td></tr>`).join("")}</tbody></table></div></div>` : "";
  $("#p-stats").innerHTML = `<h2>Performance</h2>
    <p class="lede">The numbers a fund manager would look at. Most need a few weeks of trades to mean much.</p>
    <div class="figures">
      <div class="fig"><div class="v">${s.win_rate == null ? "—" : s.win_rate + "%"}</div><div class="k">Win rate</div></div>
      <div class="fig"><div class="v up">${money(s.avg_win)}</div><div class="k">Average win</div></div>
      <div class="fig"><div class="v down">${money(s.avg_loss)}</div><div class="k">Average loss</div></div>
      <div class="fig"><div class="v">${s.profit_factor ?? "—"}</div><div class="k">Profit factor (gross wins ÷ gross losses)</div></div>
      <div class="fig"><div class="v">${s.avg_r == null ? "—" : s.avg_r + "R"}</div><div class="k">Average result, in units of risk</div></div>
      <div class="fig"><div class="v down">${s.max_drawdown_pct == null ? "—" : s.max_drawdown_pct + "%"}</div><div class="k">Worst drop from a peak</div></div>
      <div class="fig"><div class="v">${s.sharpe ?? "—"}</div><div class="k">Sharpe ratio (needs 10+ days)</div></div>
      <div class="fig"><div class="v">${s.closed}</div><div class="k">Closed trades</div></div>
    </div>
    <div class="two">${group(s.by_bucket, "By bucket")}${group(s.by_asset, "By market")}</div>
    ${group(s.by_style, "By trading style")}
    <h3>Strategy tournament</h3>
    <p class="lede small">Each trading style competes for money. Styles that make money get bigger bets (up to 1.5x); styles that lose get smaller ones (down to 0.5x). Last 45 days.</p>
    ${d.tournament && d.tournament.board.length ? `<div class="scroll"><table><thead><tr><th>Style</th><th class="num">Trades</th><th class="num">Win rate</th><th class="num">Avg result</th><th class="num">Profit</th><th class="num">Bet size</th></tr></thead><tbody>
      ${d.tournament.board.map(b => `<tr><td>${esc(b.style)}</td><td class="num">${b.trades}</td><td class="num">${b.win_rate}%</td><td class="num ${cls(b.avg_r)}">${b.avg_r}R</td><td class="num ${cls(b.pnl)}">${signed(b.pnl)}</td><td class="num">${b.weight}x</td></tr>`).join("")}
      </tbody></table></div>
      <p class="small muted">Calibration: ${d.tournament.calibration.trades ? `predicted ${d.tournament.calibration.predicted}% wins, actual ${d.tournament.calibration.actual}%, so every bet is scaled ${d.tournament.calibration.factor}x.` : "needs closed trades."}</p>`
      : `<p class="empty">Starts once trades close. Until then every style bets at 1x.</p>`}
    <h3>Backtest of the chart setups</h3>
    ${d.backtest ? `<p class="lede small">How each setup the scanner flags would have done over ~2 years on ${d.backtest.symbols} stocks and ETFs (${esc(d.backtest.rules)}). The analysts see this before every decision. Updated ${when(d.backtest.updated)}.</p>
      <div class="scroll"><table><thead><tr><th>Setup</th><th>Side</th><th class="num">Trades</th><th class="num">Win rate</th><th class="num">Avg result</th></tr></thead><tbody>
      ${d.backtest.results.map(r => `<tr><td>${esc(r.setup)}</td><td>${r.direction === "short" ? "Short" : "Long"}</td><td class="num">${r.trades.toLocaleString()}</td><td class="num">${r.win_rate}%</td><td class="num ${cls(r.avg_r)}">${r.avg_r > 0 ? "+" : ""}${r.avg_r}R</td></tr>`).join("")}

    ${d.edge && (d.edge.daily || []).length ? `<div class="chart-box"><canvas id="c-daily"></canvas></div>` : `<p class="empty">Shows up after the first full trading day.</p>`}
    <h3>Is its confidence honest?</h3>
    <p class="lede small">Each trade comes with the desk's own odds of hitting the target. Well-calibrated means its 70% calls win about 70% of the time.</p>

  if (document.getElementById("c-daily")) {

      {label: "S&P 500", data: dd.map(x => x.spy_pct), backgroundColor: css("--spy"), borderRadius: 3, borderSkipped: "start"}]},
      options: {plugins: {tooltip: {callbacks: {label: (i) => `${i.dataset.label}: ${i.parsed.y > 0 ? "+" : ""}${i.parsed.y.toFixed(2)}%`}}},
        scales: {x: axis("", {grid: {display: false}, ticks: {color: css("--ink-3"), maxTicksLimit: 10}}), y: axis("Daily return (%)")}}});
  }
  if (s.calibration.length) {
    if (charts.calib) charts.calib.destroy();
    charts.calib = new Chart($("#calib"), { type: "bar",
      data: { labels: s.calibration.map(c => c.confidence + "% calls"), datasets: [
        { label: "What it predicted", data: s.calibration.map(c => c.confidence + 5), backgroundColor: css("--spy") },
        { label: "What actually happened", data: s.calibration.map(c => c.actual_win_rate), backgroundColor: css("--ink") } ] },
      options: { responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { labels: { color: css("--ink-2") } } },
        scales: { y: { max: 100, ticks: { color: css("--ink-3"), callback: v => v + "%" }, grid: { color: css("--rule") } }, x: { ticks: { color: css("--ink-3") }, grid: { display: false } } } } });
  }
}

  const rows = d.ghost.filter(g => g.price_now);
  $("#p-ghost").innerHTML = `<h2>Passed ideas</h2>
    <p class="lede">Ideas the desk researched but didn't trade, and how they moved since. If the skipped ideas keep winning, the desk is being too cautious.</p>
    ${rows.length ? `<div class="scroll"><table><thead><tr><th>Symbol</th><th>Researched</th><th>Outcome</th><th class="num">Then</th><th class="num">Now</th><th class="num">Move in the bull's direction</th></tr></thead><tbody>

/* ---------- glossary: tap a term to see what it means ---------- */
const GLOSSARY = {
  "ATR": "Average true range: how much the price typically moves in a day. Stops are usually set a few ATRs away.",
  "RSI": "Relative strength index: a 0-100 gauge of how stretched a price is. Above 70 is overbought, below 30 oversold.",
  "R": "One unit of risk: what you'd lose if the stop hits. A +2R trade made twice what it risked.",
  "P/E": "Price to earnings: what investors pay for each $1 of yearly profit. Higher means pricier or more growth expected.",
  "conviction": "How strongly the portfolio manager believes in a trade, 1-10. Higher conviction means a bigger bet.",
  "stop-loss": "A price where the trade is closed automatically to cap the loss: the point where the idea is proven wrong.",
  "short selling": "Betting a price will fall: sell borrowed shares now, buy them back cheaper later.",
  "call options": "Options that pay off if the stock rises above a set price before a date. The most you can lose is what you paid.",
  "put options": "Options that pay off if the stock falls below a set price before a date. The most you can lose is what you paid.",
  "options trader": "Trades options: contracts that pay off if a stock moves past a set price by a set date.",
  "premium": "The price paid for an option. It's the most an options buyer can lose.",
  "drawdown": "How far the account fell from its highest point before recovering.",
  "Sharpe ratio": "Return per unit of volatility. Above 1 is good; above 2 is excellent.",
  "profit factor": "Total money won divided by total money lost. Above 1 means the desk makes money overall.",
  "win rate": "The share of closed trades that made money.",
  "bracket order": "An order with a stop-loss and take-profit attached, so the broker exits automatically.",
  "breakout": "Price pushing above a recent high, often a sign a new move is starting.",
  "breakdown": "Price falling below a recent low, often a sign of more selling.",
  "momentum": "Trading in the direction a price is already moving strongly.",
  "mean reversion": "Betting a stretched price snaps back toward its average.",
  "risk-off": "When investors get nervous and move money out of risky assets into safer ones.",
  "regime": "The market's current mood or state, like a strong uptrend or a defensive, risk-off market.",
  "reward-to-risk": "How much the trade can make compared with how much it can lose.",
  "dry run": "Practice mode: the desk researches and logs trades but doesn't place orders.",
  "pre-mortem": "Imagining a trade already failed and explaining why, to catch problems before they happen.",
  "bucket": "Which pot of money a trade comes from: core (quality swings), tactical (short-term) or high-risk.",
  "hit rate": "How often someone's calls turned out right. 50% is a coin flip.",
  "S&P 500": "An index of 500 big US companies, the standard benchmark to beat.",
  "insider": "Executives and directors buying or selling their own company's stock. Buying is often a good sign.",
  "13F": "A quarterly filing showing what big investment funds own.",
  "forex": "Trading currencies against each other, like euros versus dollars.",
  "leverage": "Controlling more money than you have, which magnifies gains and losses.",
  "backtest": "Testing a strategy on past data to see how it would have done.",
  "calibration": "Whether the desk's stated odds match reality: 70% calls should win about 70% of the time.",
  "p-value": "The chance of seeing results this good from pure luck. Under 0.05 (5%) is the usual bar for 'probably not luck'.",
  "confidence interval": "The range the true value most likely sits in. Narrow means we know it well; wide means we need more data.",
  "expectancy": "The average result per trade, in R. Positive expectancy means the strategy makes money over many trades.",
  "alpha": "Return beyond what the market's moves explain. Positive alpha is the skill part.",
  "beta": "How much the account moves with the market. 1 means it moves like the S&P 500; 0 means unrelated.",
  "bootstrap": "Re-sampling the real trades thousands of times to see how much the results could vary by chance.",
  "Monte Carlo": "Simulating thousands of possible futures by drawing from the desk's real trade results.",
  "coin-flip": "A trader with the same trade sizes but random direction. The baseline that pure luck would produce.",
  "statistically significant": "Unlikely to be luck, usually meaning a p-value under 0.05.",
};
const GKEYS = Object.keys(GLOSSARY).sort((a, b) => b.length - a.length);
const GRE = new RegExp(`(?<![\\w/])(${GKEYS.map(k => k.replace(/[.*+?^${}()|[\]\\\/&]/g, "\\$&")).join("|")})(?![\\w/])`, "i");

function gloss(root) {
  if (!root) return;
  const seen = new Set();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: (n) => {
    const p = n.parentElement;
    if (!p || p.closest("abbr, script, style, canvas, h2, .avatar, .seat-name, .sym, .hit, .side")) return NodeFilter.FILTER_REJECT;
    return GRE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
  }});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const m = n.nodeValue.match(GRE); if (!m) continue;
    const key = GKEYS.find(k => k.toLowerCase() === m[1].toLowerCase());
    const scope = n.parentElement.closest(".person, .feed-row, .idea, tr, .fig, p, li") || root;
    const tag = key + "|" + (scope.dataset.gid || (scope.dataset.gid = Math.random().toString(36).slice(2)));
    if (seen.has(tag) || (key === "R" && m[1] !== "R")) continue;
    seen.add(tag);
    const after = n.splitText(m.index); after.nodeValue = after.nodeValue.slice(m[1].length);
    const ab = document.createElement("abbr"); ab.className = "g"; ab.dataset.term = key; ab.textContent = m[1];
    n.parentNode.insertBefore(ab, after);
  }
}

  if (!sh || !Object.values(sh.strategies || {}).some(x => (x.stats || {}).n)) return `<p class="empty">Shadow results start about a day after each research session, once prices have moved.</p>`;

    ${rows.map(([k, v]) => { const t = v.stats || {}, dv = v.desk_vs;

    <p class="small muted">"Luck odds" for a shadow row is the chance the desk's lead over that rule is just noise (one-sided Welch t-test).</p>`;
}

/* ---------- trading floor ---------- */
const LIVE_JOBS = ["research", "desk", "client", "learning"];
const REPO = "erwannsssss/trading-desk";
const RAW = `https://raw.githubusercontent.com/${REPO}/`;
let liveSha = null;
async function latestLiveSha() {
  // One tiny API call; the browser revalidates with ETag so unchanged checks are free.
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits/live`, {headers: {Accept: "application/vnd.github.sha"}, cache: "no-cache"});
    liveSha = r.ok ? (await r.text()).trim() : null;  // rate-limited: fall back to the (slightly cached) branch file
  } catch (e) { liveSha = null; }
  return liveSha;
}
let LIVE = {}, liveTimer = null, floorOpen = null;
const deskInfo = {
  research: ["Research desk", "Finds trades: scans the market, reads the macro picture, debates every idea"],
  trading: ["Trading desk", "Places orders, enforces the risk limits, manages every open position"],
  learning: ["Learning desk", "Reviews results, runs the tournament and backtests, writes to you"],
};
const ago = (iso) => { if (!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`; };
const clock = (iso) => new Date(iso).toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit"});
const initials = (n) => n.split(" ").map(w => w[0]).join("").slice(0, 2);

// Staff photos live in faces/<first-last>.jpg; if one is missing, fall back to initials.
const faceSlug = (n) => n.toLowerCase().trim().replace(/\s+/g, "-").replace(/[^a-z0-9-]/g, "");
const avatarInner = (name) => `<span class="ini">${esc(initials(name))}</span><img class="face" src="faces/${faceSlug(name)}.jpg" alt="" loading="lazy" onerror="this.remove()">`;

async function loadLive() {
  if (document.visibilityState === "hidden") return;
  const sha = await latestLiveSha();
  const got = await Promise.all(LIVE_JOBS.map(async j => {
    const urls = [sha ? `${RAW}${sha}/live/${j}.json` : null, `${RAW}live/live/${j}.json`, `live/${j}.json?t=${Date.now()}`].filter(Boolean);
    for (const url of urls) {
      try { const r = await fetch(url, {cache: "no-store"}); if (r.ok) return [j, await r.json()]; } catch (e) {}
    }
    return [j, null];
  }));
  LIVE = Object.fromEntries(got.filter(([, v]) => v));
  renderFloor();
}

function floorState() {
  const agents = {}, events = [];
  const staleCutoff = Date.now() - 25 * 60000;
  for (const job of Object.values(LIVE)) {
    const alive = job.running && new Date(job.updated) > staleCutoff;
    for (const [id, a] of Object.entries(job.agents || {})) {
      const st = {...a, job: job.label};
      if (st.status === "working" && !alive) st.status = "idle";
      if (!agents[id] || (st.since || "") > (agents[id].since || "")) agents[id] = st;
    }
    for (const e of job.events || []) events.push(e);
  }
  events.sort((a, b) => b.t.localeCompare(a.t));
  return {agents, events};
}

function nextUp() {
  const s = (DATA && DATA.schedule) || [];
  const ny = new Date(new Date().toLocaleString("en-US", {timeZone: "America/New_York"}));
  for (let add = 0; add < 8; add++) {
    const day = new Date(ny); day.setDate(ny.getDate() + add);
    const dow = day.getDay();
    const todays = s.filter(x => x.days === "daily" || (x.days === "weekdays" && dow >= 1 && dow <= 5) || (x.days === "sunday" && dow === 0))
      .map(x => { const [h, m] = x.time.split(":").map(Number); const d = new Date(day); d.setHours(h, m, 0, 0); return {...x, at: d}; })
      .filter(x => x.at > ny).sort((a, b) => a.at - b.at);
    if (todays.length) { const x = todays[0];
      return `${x.who} at ${x.at.toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit"})}${add ? (add === 1 ? " tomorrow" : " " + x.at.toLocaleDateString("en-US", {weekday: "long"})) : ""} (New York time)`; }
  }
  return "";
}

function personMap() {
  const m = {};
  for (const p of (DATA.roster || [])) m[p.id] = p;
  for (const i of (DATA.interns || [])) m[i.seat] = {id: i.seat, name: i.name, role: i.status === "junior" ? "Junior analyst" : "Intern",
    desk: i.status === "junior" ? "research" : "intern", reports_to: i.status === "junior" ? "pm" : "hr", intern: i};
  return m;
}

function hitBadge(id) {
  const sc = (DATA.scores || {})[id];
  const graded = ["pm", "macro", "scanner", "technical", "fundamental", "sentiment", "smartmoney", "bull", "bear", "factcheck", "sizer", "execution", "positions", "options", "risk"];
  if (!sc) return graded.includes(id) && DATA.grading_starts
    ? `<span class="hit">Hit rate starts ${new Date(DATA.grading_starts + "T12:00").toLocaleDateString("en-US", {month: "short", day: "numeric"})}</span>` : "";
  if (sc.pct == null) return `<span class="hit">${sc.total ? `${sc.total} graded, needs ${3 - sc.total} more` : "not graded yet"}</span>`;
  return `<span class="hit ${sc.pct >= 55 ? "good" : sc.pct < 45 ? "bad" : ""}">${sc.pct}% ${esc(sc.label)} (${sc.total})</span>`;
}

function personCard(p, agents, opts = {}) {
  if (!p) return "";
  const a = agents[p.id] || {};
  const working = a.status === "working";
  let now = working ? `<b>Now:</b> ${esc(a.task)}` : a.last ? esc(a.last) : (p.id === "partner" ? "Runs the firm. Pitches ideas with /pitch." : "Between tasks.");
  let extra = "";
  if (p.intern) {
    const i = p.intern, pct = Math.max(0, Math.min(100, (i.equity - 30) / (500 - 30) * 100));
    extra = `<span class="hit ${i.equity >= 150 ? "good" : "bad"}">$${(+i.equity).toFixed(2)} of $500</span>
      <span class="intern-bar"><span style="width:${pct}%"></span></span>`;
    if (!working && !a.last) now = esc(i.mood ? `Mood: ${i.mood}` : i.persona);
  }
  const avatarClass = p.id === "partner" ? "partner" : p.intern && p.intern.status !== "junior" ? "intern" : p.desk;
  return `<button class="person ${opts.head ? "head" : ""} ${p.id === "partner" ? "partner" : ""} ${working ? "working" : ""}" data-person="${esc(p.id)}">
    <span class="avatar ${avatarClass}">${avatarInner(p.name)}<span class="st"></span></span>

}

    <div class="memo-top"><div style="display:flex;gap:12px;align-items:center">
      <span class="avatar ${id === "partner" ? "partner" : i && i.status !== "junior" ? "intern" : p.desk}" style="width:56px;height:56px">${avatarInner(p.name)}</span>
      <div><h2>${esc(p.name)}</h2><div class="small muted">${esc(p.role)}${boss ? `, reports to ${esc(boss.name)}` : ""}${p.since ? `, joined ${esc(p.since)}` : ""}</div></div></div>
      <button class="close" onclick="this.closest('dialog').close()">Close</button></div>
    ${sc ? `<p class="small" style="margin-top:14px">${hitBadge(id)} ${sc.pct == null ? "" : `<span class="muted">${sc.right} of ${sc.total} over the last 30 days</span>`}</p>` : ""}
    ${p.approach ? `<p class="small"><b>Working style:</b> ${esc(p.approach)}</p>` : ""}
    ${i ? `<p class="small"><b>Style:</b> ${esc(i.persona)}<br><b>Account:</b> $${(+i.equity).toFixed(2)} (started $150, best $${(+(i.peak || i.equity)).toFixed(2)})${i.mood ? `<br><b>Mood:</b> ${esc(i.mood)}` : ""}</p>
      ${i.positions.length ? `<h3>Holding</h3><ul class="small">${i.positions.map(x => `<li>${esc(x.symbol)} ${esc(x.direction)} $${(+x.size_usd).toFixed(0)} at ${px(x.entry)}: ${esc(x.reason)}</li>`).join("")}</ul>` : ""}
      ${i.closed.length ? `<h3>Recent results</h3><ul class="small">${i.closed.slice().reverse().map(x => `<li>${esc(x.symbol)} ${esc(x.direction)}: <span class="${cls(x.pnl)}">${signed(x.pnl)}</span> (${esc(x.why)})</li>`).join("")}</ul>` : ""}` : ""}
    ${review ? `<h3>Performance review from ${esc(people.hr?.name || "HR")}: ${esc(review.grade)}</h3><p class="note">${esc(review.review)}</p>` : ""}
    <h3>Right now</h3>
    <p class="note">${a.status === "working" ? `Working on: ${esc(a.task)} (started ${ago(a.since)})` : `Between tasks. ${a.last ? "Last: " + esc(a.last) : ""}`}</p>
    <h3>Last hour (${hour.length})</h3>${hour.length ? list(hour) : `<p class="small muted">Nothing in the last hour.</p>`}
    ${earlier.length ? `<h3>Earlier</h3>${list(earlier.slice(0, 60))}` : ""}`;
  gloss($("#memo-body"));
  if (!refresh || !$("#memo").open) $("#memo").showModal();
}
$("#memo").addEventListener("close", () => { floorOpen = null; });
document.addEventListener("click", (e) => { const s = e.target.closest("[data-person]"); if (s) showPerson(s.dataset.person); });

function startLive() {
  if (!liveTimer) { loadLive(); liveTimer = setInterval(loadLive, 60000); }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadLive(); });
}

openTab((location.hash || "#overview").slice(1));
load().then(startLive);
setInterval(load, 60000);
</script>
</body>
</html>
