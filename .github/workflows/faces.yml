name: Make staff photos

# Manual only: generates AI headshots for anyone at the firm who doesn't have one yet.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Space-separated slugs to regenerate (e.g. jake-morrison ruth-klein); blank = only missing"
        default: ""

permissions:
  contents: write

jobs:
  faces:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Make photos in batches, saving after each batch
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "trading-desk-bot"
          git config user.email "trading-desk-bot@users.noreply.github.com"
          FORCE="${{ inputs.force }}"
          for batch in $(seq 1 15); do
            if [ -n "$FORCE" ] && [ "$batch" = 1 ]; then python scripts/make_faces.py --limit 5 --force $FORCE; else python scripts/make_faces.py --limit 5; fi && code=0 || code=$?
            git add docs/faces
            if ! git diff --cached --quiet; then
              git commit -qm "Staff photos (batch $batch)"
              for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 5; done
            fi
            [ "$code" = 3 ] && echo "all photos made" && exit 0
            [ "$code" = 2 ] && exit 1
          done
